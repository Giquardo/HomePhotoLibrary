server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Brotli isn't enabled - stock nginx:alpine doesn't ship the module and a
    # custom build isn't worth it for a home LAN app.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css application/json;

    # .wasm isn't in nginx's default mime.types, so it would otherwise fall
    # back to the server's default_type (application/octet-stream), which
    # some browsers refuse to instantiate as WebAssembly. Everything else
    # (including index.html) keeps using the inherited default mime.types -
    # do NOT replace it with a server-level `types {}` block here, that
    # overrides the whole table instead of extending it (learned this the
    # hard way: it made index.html download as octet-stream instead of
    # rendering).
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    # SPA fallback: unknown paths (client-side routes) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
