server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM's .wasm/.dll assets aren't always in nginx's default
    # mime.types; .wasm specifically needs the correct type for the browser
    # to instantiate it. Brotli isn't enabled - stock nginx:alpine doesn't
    # ship the module and a custom build isn't worth it for a home LAN app.
    types {
        application/wasm wasm;
        application/octet-stream dll;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css application/json;

    # SPA fallback: unknown paths (client-side routes) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
