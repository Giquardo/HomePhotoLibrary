name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Backend_dev.generated.sln

      - name: Build
        run: dotnet build Backend_dev.generated.sln --no-restore -c Release

      - name: Unit tests
        run: dotnet test UnitTests/UnitTests.csproj --no-build -c Release

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./PhotoAlbumApi
          push: false
          tags: photoalbum-api:ci

      - name: Build web Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./PhotoAlbumBlazor
          push: false
          tags: photoalbum-web:ci
